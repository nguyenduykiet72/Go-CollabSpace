pre-commit:
  parallel: false
  commands:
    tidy:
      glob: "go.{mod,sum}"
      run: go mod tidy && git add go.mod go.sum
    format:
      glob: "**/*.go"
      run: goimports -w {staged_files}
      stage_fixed: true
    lint:
      glob: "**/*.go"
      run: golangci-lint run ./...

commit-msg:
  commands:
    validate-message:
      run: |
        head -n1 {1} | grep -qE "^(feat|fix|docs|style|refactor|perf|test|chore|revert)\(GCS-[0-9]+\): .+$"
      fail_text: |
        ✗ Wrong commit message format.
        Use: <type>(GCS-NNN): <subject>
        Example: feat(GCS-42): add user authentication endpoint
        Types: feat|fix|docs|style|refactor|perf|test|chore|revert